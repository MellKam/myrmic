[package]
name = "bench"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.myrmic]
heap_size = 32_768

[dependencies]
myrmic-sdk = { git = "https://github.com/peeriot/myrmic.git", rev = "394b373b" }
bench-kernels = { path = "../kernels" }
# Same postcard the SDK uses, to time the `uptime()` decode on its own (`clock` command).
postcard = { version = "1.1.3", default-features = false }

# Standalone: keeps cargo from attaching this crate to the myrmic repo workspace.
[workspace]
